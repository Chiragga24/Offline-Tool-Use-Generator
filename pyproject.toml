[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kg-mle"
version = "0.1.0"
description = "Offline ToolBench-style synthetic multi-agent tool-use conversation generator."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "huggingface-hub>=1.0",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]
semantic = [
  "google-genai>=1.0",
  "mem0ai>=0.1.0",
  "sentence-transformers>=3.0",
]

[project.scripts]
kgmle = "kg_mle.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_mle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: integration tests that call real external services (Mem0, Hugging Face) — auto-skip when credentials are missing or the provider rejects the request.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
