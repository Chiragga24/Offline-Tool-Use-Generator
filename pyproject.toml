[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kg-mle"
version = "0.1.0"
description = "Offline ToolBench-style synthetic multi-agent tool-use conversation generator."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
kgmle = "kg_mle.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_mle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

